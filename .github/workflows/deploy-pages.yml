name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build site
        run: npm run build
      - name: Install Chromium for math direction regression tests
        run: npx playwright install --with-deps chromium
      - name: Verify math direction and visual learning activities
        env:
          TEST_BASE_URL: http://127.0.0.1:4173/hasnaa-math/
        run: |
          npm run preview -- --port 4173 > /tmp/hasnaa-math-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$TEST_BASE_URL" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$TEST_BASE_URL" > /dev/null
          node --test tests/math-direction.test.js tests/visual-learning.test.js tests/short-copy.test.js
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
